[versions]
kotlin = "2.0.21"
junit = "5.11.3"
restAssured = "5.5.0"
kotest = "5.9.1"
kotlinpoet = "1.18.1"
swaggerParser = "2.1.22"
jackson = "2.18.1"
jsonSchemaValidator = "1.5.2"
wiremock = "3.9.2"
allure = "2.29.0"
slf4j = "2.0.16"
allurePlugin = "2.12.0"

[libraries]
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swaggerParser" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
rest-assured-kotlin = { module = "io.rest-assured:kotlin-extensions", version.ref = "restAssured" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

# demo
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
allure-bom = { module = "io.qameta.allure:allure-bom", version.ref = "allure" }
allure-junit5 = { module = "io.qameta.allure:allure-junit5" }
allure-rest-assured = { module = "io.qameta.allure:allure-rest-assured" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
allure = { id = "io.qameta.allure", version.ref = "allurePlugin" }
