openapi: 3.0.3
info:
  title: Swagger Petstore (demo)
  version: 1.0.0
  description: Урезанная спецификация Petstore для демонстрации фреймворка.
servers:
  - url: http://localhost
paths:
  /pets:
    get:
      operationId: listPets
      summary: Список питомцев
      tags: [pets]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: список питомцев
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Создать питомца
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Получить питомца по id
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: питомец
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        tag:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
